name: Build multi-platform China map image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-arm64.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: china-map-arm64
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish ARM64 and AMD64
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 180
    defaults:
      run:
        shell: sh -e "{0}"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check native architecture and Docker
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"
          docker version

      - name: Set up QEMU for AMD64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:china-arm64
            ${{ steps.image.outputs.name }}:china-arm64-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=china-arm64
          cache-to: type=gha,mode=max,scope=china-arm64

      - name: Build and push AMD64
        id: build-amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:china-amd64
            ${{ steps.image.outputs.name }}:china-amd64-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=china-amd64
          cache-to: type=gha,mode=max,scope=china-amd64

      - name: Publish and inspect multi-platform manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
          ARM64_DIGEST: ${{ steps.build.outputs.digest }}
          AMD64_DIGEST: ${{ steps.build-amd64.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:china" \
            --tag "$IMAGE:china-$REVISION" \
            "$IMAGE@$ARM64_DIGEST" "$IMAGE@$AMD64_DIGEST"
          docker buildx imagetools inspect "$IMAGE:china-$REVISION"
          echo '## Multi-platform image (ARM64 + AMD64)' >> "$GITHUB_STEP_SUMMARY"
          echo "Image: $IMAGE:china" >> "$GITHUB_STEP_SUMMARY"
          echo "Revision: $REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo "ARM64 digest: $ARM64_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "AMD64 digest: $AMD64_DIGEST" >> "$GITHUB_STEP_SUMMARY"
