name: Build ARM64 China map image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-arm64.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: china-map-arm64
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish ARM64
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 90
    defaults:
      run:
        shell: sh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check native architecture and Docker
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"
          docker version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:china-arm64
            ${{ steps.image.outputs.name }}:china-arm64-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=china-arm64
          cache-to: type=gha,mode=max,scope=china-arm64

      - name: Write image details
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo '## ARM64 image' >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$IMAGE:china-arm64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
