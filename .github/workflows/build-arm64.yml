name: Build multi-platform China map image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-arm64.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: china-map-arm64
  cancel-in-progress: false

jobs:
  build:
    name: Build native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: '["self-hosted", "Linux", "ARM64"]'
          - arch: amd64
            runner: '["ubuntu-24.04"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    defaults:
      run:
        shell: sh -e "{0}"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check native architecture and Docker
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          ACTUAL=$(uname -m)
          echo "Native architecture: $ACTUAL; target: $EXPECTED_ARCH"
          case "$EXPECTED_ARCH:$ACTUAL" in
            arm64:aarch64|amd64:x86_64) ;;
            *) echo 'Runner architecture does not match target'; exit 1 ;;
          esac
          docker version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:china-${{ matrix.arch }}
            ${{ steps.image.outputs.name }}:china-${{ matrix.arch }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=china-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=china-${{ matrix.arch }}

  manifest:
    name: Publish multi-platform manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and inspect multi-platform manifest
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "$IMAGE:china" \
            --tag "$IMAGE:china-$REVISION" \
            "$IMAGE:china-arm64-$REVISION" "$IMAGE:china-amd64-$REVISION"
          docker buildx imagetools inspect "$IMAGE:china-$REVISION"
          echo '## Multi-platform image (native ARM64 + native AMD64)' >> "$GITHUB_STEP_SUMMARY"
          echo "Image: $IMAGE:china" >> "$GITHUB_STEP_SUMMARY"
          echo "Revision: $REVISION" >> "$GITHUB_STEP_SUMMARY"
